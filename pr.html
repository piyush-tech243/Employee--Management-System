<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="employee-card">
        <h1>Employee Management system</h1>

        <p>Welcome to Employee Management System</p>
        <p>Manage your Employee Easily</p>
    </div>


    <div class="button-container">
        <button class="add-btn">ADD Employee</button>
        <button class="view-btn">View Employee</button>
    </div>

    <div class="search-container">

    <input 
        type="text" 
        id="searchEmployee" 
        placeholder="Search by Name, ID or Email"
    >

    <button class="search-btn">Search</button>

</div>

    <div id="employeeList"></div>
    <div class="pagination" style="display:none;">
    <button id="previousBtn">Previous</button>
    <span id="pageNumber">Page 1</span>
    <button id="nextBtn">Next</button>
</div>
    <div class="employee-form" style="display:none;">

        <label>Employee Name</label>
        <input type="text" id="employeeName" placeholder="Enter Employee Name">
        <p id="nameError"></p>


        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Email">
        <p id="emailError"></p>

        <select id="department">
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Sales</option>
        </select>


        <label>Salary</label>
        <input type="number" id="salary" placeholder="Enter Salary">
        <p id="salaryError"></p>


        <button class="submit-btn">Save Employee</button>

    </div>
    <script>
    const addButton = document.querySelector('.add-btn');
    const viewButton = document.querySelector('.view-btn');
    const searchInput = document.querySelector("#searchEmployee");
    const searchButton = document.querySelector(".search-btn");
    const submitButton = document.querySelector('.submit-btn');
    const employeeList = document.querySelector("#employeeList");

    const previousBtn = document.querySelector("#previousBtn");
    const nextBtn = document.querySelector("#nextBtn");
    const pageNumber = document.querySelector("#pageNumber");

    nextBtn.addEventListener("click", function(){

    currentPage = currentPage + 1;

    pageNumber.innerText = "Page " + currentPage;

    viewButton.click();

});
   previousBtn.addEventListener("click", function(){

    currentPage = currentPage - 1;

    pageNumber.innerText = "Page " + currentPage;

    viewButton.click();

});

    const employeeName = document.querySelector("#employeeName");
    const nameError = document.querySelector("#nameError");
    const email = document.querySelector("#email");
    const emailError = document.querySelector("#emailError");
    const department = document.querySelector("#department");
    const salary = document.querySelector("#salary");

    const salaryError = document.querySelector("#salaryError");

    let editingEmployeeId = null;
    let currentPage = 1;
    const employeesPerPage = 10;

    searchButton.addEventListener("click", function(){
        document.querySelector(".pagination").style.display = "none";

    const searchValue = searchInput.value.trim();

    employeeList.innerHTML = "";

    fetch(`http://127.0.0.1:8000/employees/search?search=${encodeURIComponent(searchValue)}`)
        .then(response => response.json())
        .then(data => {
             if(data.employees.length === 0){

        employeeList.innerHTML = "<p>No employee found</p>";
        return;

    }
    data.employees.forEach(function(employee){

        employeeList.innerHTML += `
            <div class="employee-box" id="employee-${employee.id}">

                <p>Name: ${employee.name}</p>
                <p>Email: ${employee.email}</p>
                <p>Department: ${employee.department}</p>
                <p>Salary: ${employee.salary}</p>

                <button class="edit-btn" onclick="editEmployee(${employee.id})">
                    Edit
                </button>

                <button class="delete-btn" onclick="deleteEmployee(${employee.id})">
                    Delete
                </button>

            </div>
        `;

    });

});
});


    addButton.addEventListener("click", function(){

    document.querySelector(".employee-form").style.display = "block";

    employeeList.innerHTML = "";
    employeeList.style.display = "none";
    searchInput.value = "";

    employeeName.value = "";
    email.value = "";
    department.value = "IT";
    salary.value = "";

    editingEmployeeId = null;

});

    // VIEW EMPLOYEES
    viewButton.addEventListener("click", function(){
    document.querySelector(".employee-form").style.display = "none";
       // alert("view clicked");
        employeeList.style.display = "block";
        document.querySelector(".pagination").style.display = "block";
        employeeList.innerHTML = "";

        fetch(`http://127.0.0.1:8000/employees?page=${currentPage}&limit=${employeesPerPage}`)
            .then(response => response.json())
            .then(data => {
                const totalPages = Math.ceil(data.total_employees / employeesPerPage);
                nextBtn.disabled = currentPage >= totalPages;
                previousBtn.disabled = currentPage === 1;
                data.employees.forEach(function(employee){


                    employeeList.innerHTML += `
                        <div class="employee-box" id="employee-${employee.id}">

                            <p>Name: ${employee.name}</p>
                            <p>Email: ${employee.email}</p>
                            <p>Department: ${employee.department}</p>
                            <p>Salary: ${employee.salary}</p>

                            <button class="edit-btn" onclick="editEmployee(${employee.id})">
                                Edit
                            </button>

                            <button class="delete-btn" onclick="deleteEmployee(${employee.id})">
                                Delete
                            </button> 

                        </div>
                    `;

                });

            });

    });


    // EDIT EMPLOYEE
    function editEmployee(id){

        editingEmployeeId = id;
          document.querySelector(".employee-form").style.display = "block";
          document.querySelector("#employeeList").style.display = "none";

        fetch(`http://127.0.0.1:8000/employees/${id}`)
            .then(response => response.json())
            .then(employee => {

                console.log(employee);

                employeeName.value = employee.name;
                email.value = employee.email;
                department.value = employee.department;
                salary.value = employee.salary;
            });

    }
     

// DELETE EMPLOYEE
function deleteEmployee(id){
    const confirmDelete = confirm("Are you sure you want to delete this employee?");

    if(!confirmDelete){
        return;
    }
    fetch(`http://127.0.0.1:8000/employees/${id}`, {
        method: "DELETE"
    })
    .then(response => response.json())
    .then(data => {

        console.log("DELETE Response:", data);
        document.querySelector(`#employee-${id}`).remove();
    });

}

    // SAVE EMPLOYEE
    submitButton.addEventListener("click", function(){
        //name khali hone ke liye

        if(employeeName.value.trim() === ""){
    nameError.innerText = "Please enter employee name";
    return;
}

nameError.innerText = "";
        
//email glt hone ke liye 

    if(email.value.trim() === ""){
    emailError.innerText = "Please enter email";
    return;
}

if(!email.value.endsWith("@gmail.com") || email.value.startsWith("@")){
    emailError.innerText = "Please enter a valid Gmail address";
    return;
}

emailError.innerText = "";

////salary kahli rehne ke liye 

if(salary.value.trim() === ""){
    salaryError.innerText = "Please enter salary";
    return;
}
   
if(salary.value < 0){
    salaryError.innerText = "Salary cannot be negative";
    return;
}

salaryError.innerText = "";


        const employeeData = {

            name: employeeName.value,
            email: email.value,
            department: department.value,
            salary: salary.value

        };

        console.log(employeeData);


        // UPDATE EMPLOYEE
        if(editingEmployeeId !== null){

    console.log("Update Employee:", editingEmployeeId);

    fetch(`http://127.0.0.1:8000/employees/${editingEmployeeId}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(employeeData)

    })
    .then(response => response.json())
    .then(data => {

        console.log("PUT Response:", data);

    });

}


        // ADD NEW EMPLOYEE
        else{

            fetch("http://127.0.0.1:8000/employees", { 

    method: "POST", 

    headers: { 
        "Content-Type": "application/json" 
    }, 

    body: JSON.stringify(employeeData) 

})
.then(response => response.json())
.then(data => {

    document.querySelector(".employee-form").style.display = "none";

});
        }
    });

</script>

</body>
</html>
